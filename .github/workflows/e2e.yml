name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        # Pinned, not `latest`: resolving `latest` hits the GitHub releases API
        # unauthenticated and intermittently fails CI with "rate limit exceeded".
        with: { version: 2.111.0 }
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:up
      - run: npm run e2e:ci -- e2e/smoke
      # AI video generation against the MOCK provider: the web container sets
      # E2E_EXPLORE=1 and NODE_ENV=test, which src/lib/seedance refuses to go live
      # under, so CI never spends video tokens.
      - run: >-
          npm run e2e:ci --
          e2e/creator/ai-video-generate.spec.ts
          e2e/creator/ai-video.spec.ts
          e2e/ai-video-tasks.spec.ts
          e2e/ai-video-fulfillment.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runs
          path: .e2e/runs/latest
      - if: always()
        run: npm run e2e:down
